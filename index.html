<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Website</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
    h1 { color: #2d3a8c; }
    .card { background: white; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { background: #2d3a8c; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Hello, I'm Idowu Blessing Olawumi</h1>
  <div class="card">
    <h2>About Me</h2>
    <p>I am learning frontend development and I love building things for the web.</p>
    <button onclick="showMessage()">Click Me</button>
    <p id="message"></p>
  </div>
  <script>
    function showMessage() {
      document.getElementById("message").innerText = "Thanks for visiting my page!";
    }
  </script>
</body>
</html>
